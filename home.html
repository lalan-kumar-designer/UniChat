
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">

    <title>UniChat - Home</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        unichat: {
                            bg: '#020617',
                            card: 'rgba(30, 41, 59, 0.4)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            primary: '#3b82f6',
                            primaryHover: '#2563eb'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(
                circle at top right,
                #1e1b4b 0%,
                #020617 40%,
                #0f172a 100%
            );
            background-attachment: fixed;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .glass-nav {
            background: rgba(2,6,23,0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .slide-up {
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0.03) 25%,
                rgba(255,255,255,0.08) 50%,
                rgba(255,255,255,0.03) 75%
            );
            background-size: 200% 100%;
            animation: shimmerEffect 1.5s infinite;
        }

        @keyframes shimmerEffect {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .toast {
            animation: toastSlideIn 0.3s ease forwards;
        }

        @keyframes toastSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .hidden-view {
            display: none !important;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <!-- APPLICATION LOGIC -->
    <script>

    "use strict";

    // ======================================
    // CONFIGURATION
    // ======================================

    const API_URL = "http://127.0.0.1:5000";

    const ENDPOINTS = {
        me: "/api/me",
        chats: "/api/chats",
        csrf: "/api/csrf",
        logout: "/logout"
    };

    let csrfToken = null;
    let currentChats = [];
    let activeFilter = "all";
    let logoutInProgress = false;

    // ======================================
    // SAFE API REQUEST
    // ======================================

    async function apiRequest(path, options = {}) {

        const headers = new Headers(options.headers || {});

        if (csrfToken && options.method && options.method !== "GET") {
            headers.set("X-CSRF-Token", csrfToken);
        }

        const response = await fetch(API_URL + path, {
            ...options,
            headers,
            credentials: "include",
            cache: "no-store",
            redirect: "error"
        });

        if (response.status === 401 || response.status === 403) {
            throw new Error("AUTH_REQUIRED");
        }

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            throw new Error("Invalid server response.");
        }

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Server request failed.");
        }

        return data;
    }

    // ======================================
    // TOAST
    // ======================================

    window.showToast = function(message, type = "success") {

        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");

        const success = type === "success";

        toast.className =
            "toast px-5 py-3 rounded-xl shadow-xl border text-sm text-white " +
            (success
                ? "bg-blue-600 border-blue-400"
                : "bg-red-600 border-red-400");

        // Never insert server text as HTML.
        toast.textContent = String(message);

        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 3000);

    };

    // ======================================
    // NAVIGATION
    // ======================================

    window.navigate = function(page) {

        const allowedPages = [
            "home.html",
            "search.html",
            "notifications.html",
            "profile.html",
            "chat.html",
            "groups.html",
            "calls.html"
        ];

        const pageName = page.split("?")[0];

        if (!allowedPages.includes(pageName)) {
            showToast("Invalid page.", "error");
            return;
        }

        // Query values are not trusted as HTML.
        window.location.assign(page);

    };

    // ======================================
    // MENU
    // ======================================

    window.showMenu = function() {

        const panel = document.getElementById("menu-panel");
        const button = document.getElementById("menu-button");

        panel.classList.toggle("hidden-view");

        button.setAttribute(
            "aria-expanded",
            String(!panel.classList.contains("hidden-view"))
        );

    };

    document.addEventListener("click", function(e) {

        const panel = document.getElementById("menu-panel");
        const button = document.getElementById("menu-button");

        if (!panel.contains(e.target) && !button.contains(e.target)) {

            panel.classList.add("hidden-view");
            button.setAttribute("aria-expanded", "false");

        }

    });

    // ======================================
    // SAFE IMAGE URL
    // ======================================

    function safeImageURL(value, name) {

        const fallback = "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(name || "Student") +
            "&background=3b82f6&color=fff";

        if (!value || typeof value !== "string") {
            return fallback;
        }

        try {

            const url = new URL(value, window.location.origin);

            if (
                url.protocol !== "https:" &&
                url.origin !== window.location.origin
            ) {
                return fallback;
            }

            return url.href;

        } catch {
            return fallback;
        }

    }

    // ======================================
    // PROFILE RENDER
    // ======================================

    function renderProfile(user) {

        const name = user.fullName || user.name || "Student";

        document.getElementById("profile-name").textContent = name;

        document.getElementById("profile-username").textContent =
            user.username ? "@" + user.username : "@user";

        const photo = document.getElementById("profile-photo");
        const shimmer = document.getElementById("profile-photo-shimmer");

        photo.onload = () => {
            shimmer.classList.add("hidden");
            photo.classList.remove("hidden");
        };

        photo.onerror = () => {
            photo.src = "https://ui-avatars.com/api/?name=Student&background=3b82f6&color=fff";
        };

        photo.src = safeImageURL(user.photoURL || user.photo_url, name);

    }

    // ======================================
    // SAFE CHAT IMAGE
    // ======================================

    function createAvatar(src, name) {

        const img = document.createElement("img");

        img.className =
            "w-12 h-12 rounded-full object-cover border border-white/10";

        img.alt = name + " profile";

        img.loading = "lazy";

        img.referrerPolicy = "no-referrer";

        img.src = safeImageURL(src, name);

        return img;

    }

    // ======================================
    // CHAT RENDERING
    // ======================================

    function renderChats(chats) {

        const container = document.getElementById("chats-container");

        container.replaceChildren();

        if (!Array.isArray(chats)) {
            showEmptyState("Invalid chat data.");
            return;
        }

        if (chats.length === 0) {
            showEmptyState("No recent chats. Start a conversation!");
            return;
        }

        chats.forEach(chat => {

            if (!chat || typeof chat !== "object") return;

            const id = String(chat.id || "");

            // Prevent unsafe navigation IDs.
            if (!/^[a-zA-Z0-9_-]{1,100}$/.test(id)) return;

            const name = String(chat.name || "Unknown User");

            const lastMessage = String(chat.lastMessage || "No messages yet");

            const unread = Math.max(
                0,
                Math.min(9999, Number(chat.unreadCount) || 0)
            );

            const row = document.createElement("button");

            row.type = "button";

            row.className =
                "w-full flex items-center gap-3 p-3 sm:p-4 rounded-2xl glass hover:bg-white/10 transition-colors text-left";

            row.addEventListener("click", () => {
                window.location.assign(
                    "chat.html?id=" + encodeURIComponent(id)
                );
            });

            const avatarWrapper = document.createElement("div");
            avatarWrapper.className = "relative flex-shrink-0";

            avatarWrapper.appendChild(
                createAvatar(chat.photo || chat.photoURL, name)
            );

            if (chat.isOnline === true) {

                const online = document.createElement("span");

                online.className =
                    "absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-800 rounded-full";

                avatarWrapper.appendChild(online);

            }

            const content = document.createElement("div");

            content.className = "flex-1 min-w-0";

            const top = document.createElement("div");

            top.className =
                "flex justify-between items-center gap-2 mb-1";

            const title = document.createElement("h3");

            title.className =
                "text-sm font-semibold text-gray-100 truncate";

            title.textContent = name;

            const time = document.createElement("span");

            time.className =
                "text-[10px] text-gray-500 flex-shrink-0";

            const timestamp = new Date(chat.timestamp);

            if (!Number.isNaN(timestamp.getTime())) {
                time.textContent = timestamp.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }

            top.append(title, time);

            const bottom = document.createElement("div");

            bottom.className =
                "flex justify-between items-center gap-2";

            const message = document.createElement("p");

            message.className =
                "text-xs text-gray-400 truncate";

            message.textContent = lastMessage;

            bottom.appendChild(message);

            if (unread > 0) {

                const badge = document.createElement("span");

                badge.className =
                    "bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full flex-shrink-0";

                badge.textContent = String(unread);

                bottom.appendChild(badge);

            }

            content.append(top, bottom);

            row.append(avatarWrapper, content);

            row.dataset.type = chat.type === "group" ? "group" : "personal";

            row.dataset.favourite = String(chat.isFavourite === true);

            container.appendChild(row);

        });

        applyFilter();

        if (!container.children.length) {
            showEmptyState("No chats available.");
        }

    }

    // ======================================
    // EMPTY STATE
    // ======================================

    function showEmptyState(message) {

        const container = document.getElementById("chats-container");

        container.replaceChildren();

        const box = document.createElement("div");

        box.className =
            "text-center py-10 px-4 glass rounded-2xl";

        const icon = document.createElement("i");

        icon.className =
            "ph ph-chat-circle-slash text-4xl text-gray-500";

        const title = document.createElement("h3");

        title.className = "text-gray-300 font-medium mt-2";

        title.textContent = message;

        const button = document.createElement("button");

        button.type = "button";

        button.className =
            "mt-4 px-6 py-2 bg-blue-600 text-white text-sm rounded-full";

        button.textContent = "New Chat";

        button.addEventListener("click", () => {
            navigate("chat.html");
        });

        box.append(icon, title, button);

        container.appendChild(box);

    }

    // ======================================
    // CHAT FILTER
    // ======================================

    function applyFilter() {

        document.querySelectorAll("#chats-container > button").forEach(row => {

            const type = row.dataset.type;
            const favourite = row.dataset.favourite === "true";

            let visible = true;

            if (activeFilter === "personal") {
                visible = type === "personal";
            }

            if (activeFilter === "group") {
                visible = type === "group";
            }

            if (activeFilter === "favourite") {
                visible = favourite;
            }

            row.classList.toggle("hidden", !visible);

        });

    }

    document.querySelectorAll(".category-btn").forEach(button => {

        button.addEventListener("click", () => {

            activeFilter = button.dataset.filter;

            document.querySelectorAll(".category-btn").forEach(btn => {

                btn.classList.remove("bg-blue-600", "text-white");

                btn.classList.add("glass", "text-gray-300");

            });

            button.classList.add("bg-blue-600", "text-white");

            button.classList.remove("glass", "text-gray-300");

            applyFilter();

        });

    });

    // ======================================
    // LOAD CHATS
    // ======================================

    window.loadChats = async function() {

        const container = document.getElementById("chats-container");

        try {

            const result = await apiRequest(ENDPOINTS.chats);

            if (!result.success) {
                throw new Error(result.message || "Unable to load chats.");
            }

            currentChats = Array.isArray(result.chats)
                ? result.chats
                : [];

            renderChats(currentChats);

            const unreadExists = currentChats.some(
                chat => Number(chat.unreadCount) > 0
            );

            document.getElementById("notif-badge")
                .classList.toggle("hidden", !unreadExists);

        } catch(error) {

            if (error.message === "AUTH_REQUIRED") {
                redirectToLogin();
                return;
            }

            console.error("Chat loading error:", error);

            container.replaceChildren();

            showEmptyState("Unable to load chats. Please refresh.");

        }

    };

    // ======================================
    // AUTHENTICATION CHECK
    // ======================================

    async function checkAuthentication() {

        try {

            const result = await apiRequest(ENDPOINTS.me);

            if (!result.success || !result.user) {
                redirectToLogin();
                return;
            }

            renderProfile(result.user);

            await loadChats();

        } catch(error) {

            console.error("Authentication error:", error);

            redirectToLogin();

        }

    }

    // ======================================
    // CSRF TOKEN
    // ======================================

    async function loadCSRFToken() {

        const result = await apiRequest(ENDPOINTS.csrf);

        if (!result.csrfToken || typeof result.csrfToken !== "string") {
            throw new Error("CSRF token unavailable.");
        }

        csrfToken = result.csrfToken;

    }

    // ======================================
    // LOGOUT
    // ======================================

    window.logout = async function() {

        if (logoutInProgress) return;

        const confirmed = window.confirm("Are you sure you want to logout?");

        if (!confirmed) return;

        logoutInProgress = true;

        const button = document.getElementById("logout-menu-button");

        button.disabled = true;

        try {

            if (!csrfToken) {
                await loadCSRFToken();
            }

            const result = await apiRequest(ENDPOINTS.logout, {
                method: "POST"
            });

            if (!result.success) {
                throw new Error(result.message || "Logout failed.");
            }

            // Remove current page from browser history.
            redirectToLogin();

        } catch(error) {

            console.error("Logout error:", error);

            if (error.message === "AUTH_REQUIRED") {
                redirectToLogin();
                return;
            }

            showToast("Unable to logout. Please try again.", "error");

            logoutInProgress = false;
            button.disabled = false;

        }

    };

    // ======================================
    // REDIRECT TO LOGIN
    // ======================================

    function redirectToLogin() {

        window.location.replace("login.html");

    }

    // ======================================
    // START APPLICATION
    // ======================================

    async function init() {

        try {

            await loadCSRFToken();

            await checkAuthentication();

        } catch(error) {

            console.error("Application initialization error:", error);

            redirectToLogin();

        }

    }

    // Start
    init();

    </script>

</body>
</html>
