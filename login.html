
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniChat - Student Messaging</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        unichat: {
                            blue: '#3b82f6',
                            dark: '#0f172a',
                            glass: 'rgba(255, 255, 255, 0.05)',
                            border: 'rgba(255, 255, 255, 0.1)'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(
                135deg,
                #020617 0%,
                #1e1b4b 50%,
                #0f172a 100%
            );
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .glass-input option {
            background: #1e293b;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .view-hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-enter {
            animation: slideInRight 0.3s ease forwards;
        }

        .toast-exit {
            animation: slideOutRight 0.3s ease forwards;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-loading .spinner {
            display: inline-block;
        }

        .btn-loading .btn-text {
            display: none;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4 sm:p-6 text-gray-100 relative overflow-x-hidden">

    <!-- Toast Container -->
    <div id="toast-container"
         class="fixed top-5 right-5 z-50 flex flex-col gap-3">
    </div>

    <!-- Main Container -->
    <div class="glass-card w-full max-w-md md:max-w-4xl rounded-3xl overflow-hidden relative">

        <!-- LOGIN SECTION -->
        <div id="login-section"
             class="p-8 sm:p-12 md:max-w-md mx-auto w-full fade-in">

            <div class="text-center mb-10">

                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 mb-4 shadow-lg shadow-blue-500/30">
                    <i class="ph ph-chats-teardrop text-3xl text-white"></i>
                </div>

                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                    UniChat
                </h1>

                <p class="text-gray-400 mt-2 text-sm">
                    Connect with your campus community
                </p>

            </div>

            <form id="login-form" class="space-y-5">

                <!-- Mobile -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">
                        Mobile Number
                    </label>

                    <div class="flex">
                        <span class="inline-flex items-center px-4 rounded-l-xl glass-input border-r-0 text-gray-400 font-medium">
                            +91
                        </span>

                        <input
                            type="tel"
                            id="login-mobile"
                            required
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]{10}"
                            placeholder="Enter 10 digit number"
                            class="flex-1 w-full rounded-r-xl glass-input px-4 py-3 text-sm">
                    </div>
                </div>

                <!-- Password -->
                <div>

                    <div class="flex justify-between items-center mb-1.5 ml-1 mr-1">

                        <label class="block text-sm font-medium text-gray-300">
                            Password
                        </label>

                        <a href="#"
                           id="forgot-password"
                           class="text-xs text-blue-400 hover:text-blue-300 transition-colors">
                            Forgot Password?
                        </a>

                    </div>

                    <div class="relative">

                        <i class="ph ph-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>

                        <input
                            type="password"
                            id="login-password"
                            required
                            placeholder="Enter your password"
                            class="w-full rounded-xl glass-input pl-11 pr-12 py-3 text-sm">

                        <button
                            type="button"
                            onclick="togglePassword('login-password','login-eye-icon')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">

                            <i id="login-eye-icon" class="ph ph-eye text-lg"></i>

                        </button>

                    </div>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="btn-login"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl py-3.5 transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-blue-900/50 flex justify-center items-center gap-2 mt-6">

                    <span class="btn-text">Login to UniChat</span>
                    <div class="spinner"></div>

                </button>

            </form>

            <!-- Divider -->
            <div class="flex items-center my-6">

                <div class="flex-1 border-t border-white/10"></div>

                <span class="px-4 text-xs text-gray-500 font-medium">
                    OR
                </span>

                <div class="flex-1 border-t border-white/10"></div>

            </div>

            <!-- Google Login -->
            <button
                type="button"
                id="btn-google"
                class="w-full glass-input hover:bg-white/5 text-white font-medium rounded-xl py-3.5 flex items-center justify-center gap-3 transition-all">

                <img
                    src="https://www.svgrepo.com/show/475656/google-color.svg"
                    alt="Google"
                    class="w-5 h-5">

                Continue with Google

            </button>

            <!-- Register Link -->
            <p class="text-center mt-8 text-sm text-gray-400">

                New to UniChat?

                <button
                    type="button"
                    onclick="switchView('register')"
                    class="text-blue-400 font-semibold hover:text-blue-300 ml-1">

                    Create an account

                </button>

            </p>

        </div>

        <!-- REGISTER SECTION -->
        <div id="register-section"
             class="p-6 sm:p-10 w-full view-hidden max-h-[90vh] overflow-y-auto">

            <div class="flex items-center justify-between mb-8">

                <div>
                    <h2 class="text-2xl font-bold text-white">
                        Create Account
                    </h2>

                    <p class="text-gray-400 text-sm mt-1">
                        Join the ultimate student platform
                    </p>
                </div>

                <button
                    type="button"
                    onclick="switchView('login')"
                    class="p-2 rounded-full glass-input hover:bg-white/10">

                    <i class="ph ph-x text-xl text-gray-400"></i>

                </button>

            </div>

            <form id="register-form" class="space-y-6">

                <!-- Profile Photo -->
                <div class="flex flex-col items-center justify-center mb-6">

                    <div class="relative group cursor-pointer"
                         onclick="document.getElementById('reg-photo').click()">

                        <div id="photo-preview"
                             class="w-24 h-24 rounded-full glass-input flex items-center justify-center overflow-hidden border-2 border-dashed border-gray-500">

                            <i class="ph ph-camera text-3xl text-gray-500"
                               id="photo-icon"></i>

                            <img id="photo-img"
                                 src=""
                                 alt="Profile"
                                 class="w-full h-full object-cover hidden">

                        </div>

                        <div class="absolute bottom-0 right-0 bg-blue-600 rounded-full p-1.5 shadow-lg border-2 border-[#0f172a]">
                            <i class="ph ph-plus text-white text-xs"></i>
                        </div>

                    </div>

                    <p class="text-xs text-gray-400 mt-2">
                        Upload Profile Photo
                    </p>

                    <input
                        type="file"
                        id="reg-photo"
                        accept="image/jpeg,image/png,image/webp"
                        class="hidden"
                        onchange="previewImage(this)">

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <!-- Column 1 -->
                    <div class="space-y-5">

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                id="reg-name"
                                required
                                maxlength="100"
                                class="w-full rounded-xl glass-input px-4 py-2.5 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Username * (unique)
                            </label>

                            <input
                                type="text"
                                id="reg-username"
                                required
                                pattern="[a-z0-9_.]{3,20}"
                                maxlength="20"
                                placeholder="john_doe"
                                class="w-full rounded-xl glass-input px-4 py-2.5 text-sm lowercase">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Mobile Number *
                            </label>

                            <div class="flex">

                                <span class="inline-flex items-center px-3 rounded-l-xl glass-input border-r-0 text-gray-500 text-sm">
                                    +91
                                </span>

                                <input
                                    type="tel"
                                    id="reg-mobile"
                                    required
                                    maxlength="10"
                                    inputmode="numeric"
                                    pattern="[0-9]{10}"
                                    class="flex-1 w-full rounded-r-xl glass-input px-3 py-2.5 text-sm">

                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Email (Optional)
                            </label>

                            <input
                                type="email"
                                id="reg-email"
                                class="w-full rounded-xl glass-input px-4 py-2.5 text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-3">

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    Date of Birth *
                                </label>

                                <input
                                    type="date"
                                    id="reg-dob"
                                    required
                                    class="w-full rounded-xl glass-input px-3 py-2.5 text-sm [color-scheme:dark]">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    Gender *
                                </label>

                                <select
                                    id="reg-gender"
                                    required
                                    class="w-full rounded-xl glass-input px-3 py-2.5 text-sm">

                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>

                                </select>
                            </div>

                        </div>

                    </div>

                    <!-- Column 2 -->
                    <div class="space-y-5">

                        <div class="grid grid-cols-2 gap-3">

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    State *
                                </label>

                                <input
                                    type="text"
                                    id="reg-state"
                                    required
                                    class="w-full rounded-xl glass-input px-3 py-2.5 text-sm">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    District *
                                </label>

                                <input
                                    type="text"
                                    id="reg-district"
                                    required
                                    class="w-full rounded-xl glass-input px-3 py-2.5 text-sm">
                            </div>

                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                School / College Name *
                            </label>

                            <input
                                type="text"
                                id="reg-college"
                                required
                                class="w-full rounded-xl glass-input px-4 py-2.5 text-sm">
                        </div>

                        <div class="grid grid-cols-3 gap-3">

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    Course *
                                </label>

                                <input
                                    type="text"
                                    id="reg-course"
                                    required
                                    placeholder="B.Tech"
                                    class="w-full rounded-xl glass-input px-2 py-2.5 text-sm">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    Branch *
                                </label>

                                <input
                                    type="text"
                                    id="reg-branch"
                                    required
                                    placeholder="CSE"
                                    class="w-full rounded-xl glass-input px-2 py-2.5 text-sm">
                            </div>

                            <div>
                                <label class="block text-xs text-gray-400 mb-1">
                                    Sem/Class *
                                </label>

                                <input
                                    type="text"
                                    id="reg-sem"
                                    required
                                    placeholder="3rd"
                                    class="w-full rounded-xl glass-input px-2 py-2.5 text-sm">
                            </div>

                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Password *
                            </label>

                            <div class="relative">

                                <input
                                    type="password"
                                    id="reg-password"
                                    required
                                    minlength="6"
                                    class="w-full rounded-xl glass-input px-4 py-2.5 text-sm pr-10">

                                <button
                                    type="button"
                                    onclick="togglePassword('reg-password','reg-eye1')"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">

                                    <i id="reg-eye1" class="ph ph-eye"></i>

                                </button>

                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 mb-1">
                                Confirm Password *
                            </label>

                            <div class="relative">

                                <input
                                    type="password"
                                    id="reg-confirm"
                                    required
                                    minlength="6"
                                    class="w-full rounded-xl glass-input px-4 py-2.5 text-sm pr-10">

                                <button
                                    type="button"
                                    onclick="togglePassword('reg-confirm','reg-eye2')"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">

                                    <i id="reg-eye2" class="ph ph-eye"></i>

                                </button>

                            </div>
                        </div>

                    </div>

                </div>

                <!-- Bio -->
                <div>

                    <label class="block text-xs text-gray-400 mb-1">
                        About Me (Bio)
                    </label>

                    <textarea
                        id="reg-bio"
                        rows="2"
                        maxlength="500"
                        placeholder="Tell us a little about yourself..."
                        class="w-full rounded-xl glass-input px-4 py-3 text-sm resize-none"></textarea>

                </div>

                <!-- Terms -->
                <div class="flex items-start gap-3 mt-4">

                    <input
                        type="checkbox"
                        id="reg-terms"
                        required
                        class="mt-1 w-4 h-4">

                    <label for="reg-terms" class="text-xs text-gray-400">

                        I accept the Terms & Conditions and Privacy Policy of UniChat.

                    </label>

                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    id="btn-register"
                    class="w-full md:w-auto md:min-w-[200px] md:float-right bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl py-3 px-8 flex justify-center items-center gap-2">

                    <span class="btn-text">Create Account</span>
                    <div class="spinner"></div>

                </button>

                <div class="clear-both"></div>

            </form>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        // =====================================
        // CONFIGURATION
        // =====================================

        const API_URL = "http://127.0.0.1:5000";

        // =====================================
        // VIEW SWITCHING
        // =====================================

        window.switchView = function(view) {

            const login = document.getElementById("login-section");
            const register = document.getElementById("register-section");

            if (view === "register") {

                login.classList.add("view-hidden");
                register.classList.remove("view-hidden");

            } else {

                register.classList.add("view-hidden");
                login.classList.remove("view-hidden");

            }

        };

        // =====================================
        // PASSWORD VISIBILITY
        // =====================================

        window.togglePassword = function(inputId, iconId) {

            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {

                input.type = "text";
                icon.classList.replace("ph-eye", "ph-eye-slash");

            } else {

                input.type = "password";
                icon.classList.replace("ph-eye-slash", "ph-eye");

            }

        };

        // =====================================
        // PROFILE IMAGE PREVIEW
        // =====================================

        window.previewImage = function(input) {

            const file = input.files[0];

            if (!file) return;

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];

            if (!allowedTypes.includes(file.type)) {

                showToast("Only JPG, PNG and WebP allowed.", "error");
                input.value = "";
                return;

            }

            if (file.size > 2 * 1024 * 1024) {

                showToast("Image must be below 2MB.", "error");
                input.value = "";
                return;

            }

            const reader = new FileReader();

            reader.onload = function(e) {

                document.getElementById("photo-img").src = e.target.result;

                document.getElementById("photo-img").classList.remove("hidden");

                document.getElementById("photo-icon").classList.add("hidden");

                document.getElementById("photo-preview").classList.remove("border-dashed");

            };

            reader.readAsDataURL(file);

        };

        // =====================================
        // TOAST NOTIFICATION
        // =====================================

        function showToast(message, type = "success") {

            const container = document.getElementById("toast-container");

            const toast = document.createElement("div");

            const isSuccess = type === "success";

            const bgColor = isSuccess
                ? "bg-green-500/20 border-green-500/50 text-green-100"
                : "bg-red-500/20 border-red-500/50 text-red-100";

            const icon = isSuccess
                ? "ph-check-circle text-green-400"
                : "ph-warning-circle text-red-400";

            toast.className =
                `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl border backdrop-blur-md shadow-lg ${bgColor}`;

            const iconElement = document.createElement("i");

            iconElement.className = `ph ${icon} text-xl`;

            const textElement = document.createElement("p");

            textElement.className = "text-sm font-medium";

            textElement.textContent = String(message || "Something went wrong.");

            toast.append(iconElement, textElement);

            container.appendChild(toast);

            setTimeout(() => {

                toast.classList.replace("toast-enter", "toast-exit");

                setTimeout(() => toast.remove(), 300);

            }, 3000);

        }

        // =====================================
        // LOADING STATE
        // =====================================

        function setLoading(btnId, isLoading) {

            const btn = document.getElementById(btnId);

            btn.classList.toggle("btn-loading", isLoading);

            btn.disabled = isLoading;

        }

        // =====================================
        // API RESPONSE HANDLER
        // =====================================

        async function readResponse(response) {

            const contentType = response.headers.get("content-type") || "";

            if (!contentType.includes("application/json")) {

                throw new Error("Invalid server response.");

            }

            const result = await response.json();

            if (!response.ok) {

                throw new Error(result.message || "Request failed.");

            }

            return result;

        }

        // =====================================
        // REGISTER WITH FLASK
        // =====================================

        document.getElementById("register-form")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const password =
                document.getElementById("reg-password").value;

            const confirm =
                document.getElementById("reg-confirm").value;

            if (password !== confirm) {

                showToast("Passwords do not match!", "error");
                return;

            }

            const photo =
                document.getElementById("reg-photo").files[0];

            if (photo && photo.size > 2 * 1024 * 1024) {

                showToast("Image must be below 2MB.", "error");
                return;

            }

            setLoading("btn-register", true);

            const formData = new FormData();

            const fields = {

                name: "reg-name",
                username: "reg-username",
                mobile: "reg-mobile",
                email: "reg-email",
                dob: "reg-dob",
                gender: "reg-gender",
                state: "reg-state",
                district: "reg-district",
                college: "reg-college",
                course: "reg-course",
                branch: "reg-branch",
                semester: "reg-sem",
                bio: "reg-bio"

            };

            Object.entries(fields).forEach(([key, id]) => {

                let value = document.getElementById(id).value.trim();

                if (key === "username") {
                    value = value.toLowerCase();
                }

                formData.append(key, value);

            });

            formData.append("password", password);

            if (photo) {

                formData.append("photo", photo);

            }

            try {

                const response = await fetch(
                    API_URL + "/register",
                    {
                        method: "POST",
                        body: formData,
                        credentials: "include"
                    }
                );

                const result = await readResponse(response);

                if (result.success) {

                    showToast(
                        result.message || "Registration successful!",
                        "success"
                    );

                    document.getElementById("register-form").reset();

                    document.getElementById("photo-img").src = "";

                    document.getElementById("photo-img").classList.add("hidden");

                    document.getElementById("photo-icon").classList.remove("hidden");

                    document.getElementById("photo-preview").classList.add("border-dashed");

                    switchView("login");

                } else {

                    showToast(
                        result.message || "Registration failed.",
                        "error"
                    );

                }

            } catch(error) {

                console.error("Registration Error:", error);

                showToast(error.message || "Unable to connect to server.", "error");

            } finally {

                setLoading("btn-register", false);

            }

        });

        // =====================================
        // LOGIN WITH FLASK
        // =====================================

        document.getElementById("login-form")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            setLoading("btn-login", true);

            const formData = new FormData();

            formData.append(
                "mobile",
                document.getElementById("login-mobile").value.trim()
            );

            formData.append(
                "password",
                document.getElementById("login-password").value
            );

            try {

                const response = await fetch(
                    API_URL + "/login",
                    {
                        method: "POST",
                        body: formData,
                        credentials: "include"
                    }
                );

                const result = await readResponse(response);

                if (result.success) {

                    showToast(
                        result.message || "Login successful!",
                        "success"
                    );

                    const allowedPages = ["home.html"];

                    if (allowedPages.includes(result.redirect)) {

                        setTimeout(() => {

                            window.location.replace(result.redirect);

                        }, 800);

                    } else {

                        showToast("Invalid redirect destination.", "error");

                    }

                } else {

                    showToast(
                        result.message || "Invalid mobile number or password.",
                        "error"
                    );

                }

            } catch(error) {

                console.error("Login Error:", error);

                showToast(
                    error.message || "Unable to connect to server.",
                    "error"
                );

            } finally {

                setLoading("btn-login", false);

            }

        });

        // =====================================
        // FORGOT PASSWORD
        // =====================================

        document.getElementById("forgot-password")
        .addEventListener("click", function(e) {

            e.preventDefault();

            showToast(
                "Password recovery is not configured yet.",
                "error"
            );

        });

        // =====================================
        // GOOGLE LOGIN
        // =====================================

        document.getElementById("btn-google")
        .addEventListener("click", function() {

            showToast(
                "Google Login is not configured yet.",
                "error"
            );

        });

    </script>

</body>
</html>
